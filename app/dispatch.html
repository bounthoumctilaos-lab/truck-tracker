<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet dispatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#14231C;--paper:#F3F2EC;--line:#DAD8CE;--muted:#55605A;--ok:#1F7A4D;--warn:#B45309}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);height:100vh;display:grid;grid-template-columns:340px 1fr;grid-template-rows:56px 1fr}
header{grid-column:1/3;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px}
header b{font-size:18px} header .sp{flex-grow:1}
header button{height:36px;padding:0 14px;border-radius:8px;border:1px solid #4a5d53;background:transparent;color:#fff;cursor:pointer}
header button.on{background:#fff;color:var(--ink)}
aside{background:var(--paper);overflow:auto;border-right:1px solid var(--line)}
#map{height:100%}
.t{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.t:hover{background:#fff}
.dot{width:12px;height:12px;border-radius:6px;flex:none}
.t .n{font-weight:700} .t .s{font-size:13px;color:var(--muted)}
.ph{display:block;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.ph span{display:block;font-size:13px;color:var(--muted)}
.sum{padding:12px 16px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
@media(max-width:700px){body{grid-template-columns:1fr;grid-template-rows:56px 40vh 1fr}header{grid-column:1}aside{order:3}}
</style>
</head>
<body>
<header>
  <b>Fleet dispatch</b>
  <button id="tabF" class="on">Trucks</button>
  <button id="tabP">Photos</button>
  <span class="sp"></span>
  <span id="upd" style="font-size:13px;color:#B9C4BD"></span>
</header>
<aside id="side"></aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script>
// Dispatch key: open dispatch.html#key=YOUR_KEY once; it is remembered on this browser.
const m = location.hash.match(/key=([^&]+)/);
if (m) { localStorage.setItem('dkey', m[1]); history.replaceState(null, '', location.pathname); }
const KEY = localStorage.getItem('dkey') || prompt('Dispatch key (from Apps Script setup log):') || '';
localStorage.setItem('dkey', KEY);

const map = L.map('map').setView([17.97, 102.6], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
const markers = {}; let tab = 'F', fitted = false, last = { positions: [], photos: [] };

const age = (ms, now) => Math.max(0, Math.round((now - ms) / 1000));
const fmtAge = s => s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
const color = s => s < 60 ? '#1F7A4D' : s < 300 ? '#B45309' : '#8b8b8b';
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function get(q) { return (await fetch(`${API_URL}?key=${encodeURIComponent(KEY)}&${q}`)).json(); }

async function tickFleet() {
  try {
    const r = await get('action=fleet'); if (!r.ok) { document.getElementById('upd').textContent = 'Bad key'; return; }
    last.positions = r.positions.filter(p => p.lat && p.lng);
    last.now = Date.now();
    last.positions.forEach(p => {
      const a = age(p.updated, last.now), c = color(a);
      const icon = L.divIcon({ className: '', html: `<div style="background:${c};color:#fff;font:700 12px system-ui;padding:3px 7px;border-radius:8px;border:2px solid #fff;white-space:nowrap;box-shadow:0 1px 4px #0006">${esc(p.truck)}</div>`, iconSize: null });
      if (markers[p.truck]) markers[p.truck].setLatLng([p.lat, p.lng]).setIcon(icon);
      else markers[p.truck] = L.marker([p.lat, p.lng], { icon }).addTo(map);
      markers[p.truck].bindPopup(`<b>${esc(p.truck)}</b><br>${esc(p.driver)}<br>${esc(p.status)} ${p.trip ? '· ' + esc(p.trip) : ''}<br>${p.speed} km/h · ${fmtAge(a)}`);
    });
    if (!fitted && last.positions.length) { map.fitBounds(last.positions.map(p => [p.lat, p.lng]), { padding: [40, 40], maxZoom: 13 }); fitted = true; }
    document.getElementById('upd').textContent = 'Updated ' + new Date().toLocaleTimeString();
    if (tab === 'F') paintTrucks();
  } catch { document.getElementById('upd').textContent = 'Offline'; }
}
function paintTrucks() {
  const now = last.now, ps = [...last.positions].sort((a, b) => b.updated - a.updated);
  const live = ps.filter(p => age(p.updated, now) < 120).length;
  document.getElementById('side').innerHTML = `<div class="sum">${live} live · ${ps.length} reporting</div>` + ps.map(p => {
    const a = age(p.updated, now);
    return `<div class="t" data-t="${esc(p.truck)}"><span class="dot" style="background:${color(a)}"></span><div><div class="n">${esc(p.truck)} · ${esc(p.driver)}</div><div class="s">${esc(p.status || '—')} ${p.trip ? '· ' + esc(p.trip) : ''} · ${p.speed} km/h · ${fmtAge(a)}</div></div></div>`;
  }).join('') || '<div class="sum">No trucks reporting yet.</div>';
}
document.getElementById('side').onclick = e => {
  const t = e.target.closest('.t'); if (!t) return;
  const mk = markers[t.dataset.t]; if (mk) { map.setView(mk.getLatLng(), 15); mk.openPopup(); }
};
async function tickPhotos() {
  const r = await get('action=photos&limit=60'); if (!r.ok) return;
  document.getElementById('side').innerHTML = r.photos.map(p =>
    `<a class="ph" href="${esc(p.url)}" target="_blank" rel="noopener"><b>${esc(p.type)}</b> · ${esc(p.truck)} · ${esc(p.trip || '')}<span>${esc(p.driver)} · ${new Date(p.time).toLocaleString()}</span></a>`).join('') || '<div class="sum">No photos yet.</div>';
}
function setTab(t) {
  tab = t; tabF.className = t === 'F' ? 'on' : ''; tabP.className = t === 'P' ? 'on' : '';
  t === 'F' ? paintTrucks() : tickPhotos();
}
tabF.onclick = () => setTab('F'); tabP.onclick = () => setTab('P');
tickFleet(); setInterval(tickFleet, 5000); setInterval(() => tab === 'P' && tickPhotos(), 30000);
</script>
</body>
</html>
